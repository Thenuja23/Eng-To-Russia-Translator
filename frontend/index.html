<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Help learning Russian cursive writing and reading" />
    <script>
      // Hosted preview gateways block the web app manifest request (it is
      // fetched without credentials, so their session check answers 403 and the
      // console fills with errors). Register the manifest on real deployments
      // only; the app itself does not need it to run.
      (function () {
        try {
          if (!/(^|\.)style\.dev$/.test(window.location.hostname)) {
            var link = document.createElement('link')
            link.rel = 'manifest'
            link.href = '/manifest.json'
            document.head.appendChild(link)
          }
        } catch (e) {}
      })()
    </script>
    <script>
      // Apply the stored (or OS) theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('etr-theme')
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          var root = document.documentElement
          if (theme === 'dark') root.classList.add('dark')
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#3b82f6')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;700&family=Marck+Script&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Russian Cursive Learning &amp; Reading Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
